services:
  logger.channel.pb_import:
    parent: logger.channel_base
    arguments: ['pb_import']

  pb_import.utility:
    class: Drupal\pb_import\Service\Utility
    arguments: ['%site.path%']

  pb_import.file_manager:
    class: Drupal\pb_import\Service\FileManager
    arguments:
      - '@file_system'
      - '@entity_type.manager'
      - '@logger.channel.pb_import'

  pb_import.file_registrar:
    class: Drupal\pb_import\Service\FileRegistrar
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.pb_import'
      - '@messenger'
      - '@pb_import.utility'
      - '@file_system'
      - '@string_translation'

  pb_import.term_manager:
    class: Drupal\pb_import\Service\TermManager
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.pb_import'
