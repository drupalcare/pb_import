services:
  logger.channel.pb_import_node:
    parent: logger.channel_base
    arguments: ['pb_import_node']

  pb_import_node.node_creator:
    class: Drupal\pb_import_node\Service\NodeCreator
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.pb_import_node'
      - '@pb_import.term_manager'
      - '@pb_import.file_manager'

  pb_import_node.csv_processor.node:
    class: Drupal\pb_import_node\Service\CSVProcessorNode
    arguments:
      - '@file_system'
      - '@logger.channel.pb_import_node'
      - '@pb_import_node.node_creator'

  Drupal\pb_import_node\Hook\PbImportNodeHooks:
    arguments:
      - '@pb_import.help_renderer'
