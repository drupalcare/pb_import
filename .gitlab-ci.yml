# GitLab CI for drupal.org (git.drupalcode.org).
#
# Template docs: https://project.pages.drupalcode.org/gitlab_templates/
#
# The variable names are case-sensitive and are defined by the drupal.org
# instance. Lower-cased ones expand to empty strings and the include fails with
# a message about a malformed `include`, never about the variable.
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'


################
# Test every core version this project actually claims.
#
# The DA template tests only the CURRENT core version by default; every other
# variant defaults to off. A project can therefore advertise support for a core
# version no job has ever loaded it on — which is exactly how this suite spent
# months claiming `^12` with zero Drupal 12 evidence behind any of it.
#
# TWO SWITCHES ARE NEEDED PER VARIANT, NOT ONE. `OPT_IN_TEST_*` (default '0')
# decides whether the job is created; `_AUTORUN_*` (default 'none') decides
# whether it runs or falls through to a manual prerequisite. Set only the first
# and the job appears in the pipeline and is then silently skipped — a green
# pipeline with no coverage, which is worse than a missing job because it looks
# fine. That is not hypothetical: cloudflare_purge 3.1.2 shipped a class that
# was fatal to autoload on Drupal 10 with a fully green pipeline (#3614126).
#
# The next-major jobs are `allow_failure: true` in the template, so they do not
# gate a merge. They make a Drupal 12 break visible here instead of leaving it
# for a site owner to find.
################
variables:
  # cspell flags the CSV fixture vocabulary and the pb_* machine names. Turn
  # this back on together with a `.cspell-project-words.txt`.
  SKIP_CSPELL: '1'
  # info.yml claims `^11.3 || ^12`. Drupal 10 is not claimed, so there is
  # deliberately no previous-major job: testing there would assert support
  # info.yml does not offer.
  #
  # `^11.3` is a real claim and current core has moved past it, so without this
  # job the oldest supported version is never exercised.
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  # Drupal 12. EXPECT THIS JOB TO FAIL AT COMPOSER, and that is the honest
  # signal rather than a fault to suppress: this module hard-requires
  # drupal/paragraphs, which declares no `^12` in any release, so it cannot be
  # installed on Drupal 12 by composer at all. It clears when paragraphs ships
  # a D12 release. allow_failure keeps that from blocking the branch meanwhile.
  OPT_IN_TEST_NEXT_MAJOR: '1'
  _AUTORUN_NEXT_MAJOR: 'all'
