name: 'PB Import'
type: module
description: 'A module to import content and create nodes/paragraphs from a CSV file.'
core_version_requirement: ^11.3 || ^12
package: Paragraphs
dependencies:
  - drupal:block
  - drupal:field
  - drupal:file
  - drupal:node
  - drupal:taxonomy
  - drupal:filter
  - drupal:image
  - drupal:link
  - drupal:options
  - drupal:system
  - drupal:text
  - drupal:user
  - drupal:views
  - entity_reference_revisions:entity_reference_revisions
  - paragraphs:paragraphs
configure: pb_import.register_uploaded_files
