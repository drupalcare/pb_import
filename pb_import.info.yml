name: 'PB Import'
type: module
description: 'Provides the shared CSV upload form and services used by the PB Import Node and PB Import Paragraph sub-modules.'
core_version_requirement: ^11.3 || ^12
package: 'Paragraphs Bundles'
dependencies:
  - drupal:block
  - drupal:field
  - drupal:file
  - drupal:node
  - drupal:taxonomy
  - drupal:filter
  - drupal:image
  - drupal:link
  - drupal:options
  - drupal:system
  - drupal:text
  - drupal:user
  - drupal:views
  - entity_reference_revisions:entity_reference_revisions
  - paragraphs:paragraphs
  - paragraphs_bundles:paragraphs_bundles
configure: pb_import.register_uploaded_files
